<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  


<title>PrintEase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: persistent top bar, one page at a time (home, auth, dashboards, profiles) over a shared print queue */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --bg:#f2f3f8; --surface:#ffffff; --surface-2:#f7f8fc; --ink:#14172b; --muted:#5b6078; --line:#e0e3ee;
  --accent:#3344d1; --accent-ink:#ffffff; --accent-soft:#e3e7ff;
  --cy:#0aa5c8; --cy-soft:#d3f2fa; --cy-ink:#055a70;
  --mg:#e0267f; --mg-soft:#fddcec; --mg-ink:#a0125a;
  --yl:#ffc83d; --yl-soft:#fff0bf; --yl-ink:#7a5600; --hl:#ffd84d;
  --pe-bg:#ececf2; --pe-fg:#505570;
  --q-bg:#fff1c7; --q-fg:#7a5600;
  --p-bg:#d5f1f7; --p-fg:#0b5668;
  --c-bg:#d9f3e1; --c-fg:#1b6a3a;
  --d-bg:#fbe0ee; --d-fg:#9b1b5c;
  --shadow:0 1px 2px rgba(20,23,43,.06),0 4px 16px rgba(20,23,43,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b31; --surface-2:#1d2240; --ink:#eceefa; --muted:#9aa0bd; --line:#2a3050;
  --accent:#93a2ff; --accent-ink:#0e1120; --accent-soft:#252c5a;
  --cy:#38c7e8; --cy-soft:#0e3441; --cy-ink:#8fe0f2;
  --mg:#ff5fa8; --mg-soft:#4b1634; --mg-ink:#ffa8d2;
  --yl:#ffd24d; --yl-soft:#4a3a0c; --yl-ink:#ffd978; --hl:#6b5200;
  --pe-bg:#272b44; --pe-fg:#a9aec9; --q-bg:#4a3a0c; --q-fg:#ffd978; --p-bg:#0f3a46; --p-fg:#8fe0f2;
  --c-bg:#133c24; --c-fg:#8fe0ae; --d-bg:#4b1634; --d-fg:#ffa8d2;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b31; --surface-2:#1d2240; --ink:#eceefa; --muted:#9aa0bd; --line:#2a3050;
  --accent:#93a2ff; --accent-ink:#0e1120; --accent-soft:#252c5a;
  --cy:#38c7e8; --cy-soft:#0e3441; --cy-ink:#8fe0f2;
  --mg:#ff5fa8; --mg-soft:#4b1634; --mg-ink:#ffa8d2;
  --yl:#ffd24d; --yl-soft:#4a3a0c; --yl-ink:#ffd978; --hl:#6b5200;
  --pe-bg:#272b44; --pe-fg:#a9aec9; --q-bg:#4a3a0c; --q-fg:#ffd978; --p-bg:#0f3a46; --p-fg:#8fe0f2;
  --c-bg:#133c24; --c-fg:#8fe0ae; --d-bg:#4b1634; --d-fg:#ffa8d2;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.02em}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.ic.lg{width:26px;height:26px}
.ic.xl{width:44px;height:44px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.brand h1{font-size:21px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chip{display:flex;align-items:center;gap:10px;margin-right:6px}
.chip-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.chip-t b{font-size:14px;overflow-wrap:anywhere}
.chip-t small{color:var(--muted);font-size:12px}
.avatar{border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.md{width:72px;height:72px;font-size:26px}
.avatar.xl{width:104px;height:104px;font-size:38px}
.relwrap{position:static}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.bell .dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--d-fg);color:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center;padding-inline:5px}
.panel{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,100%);max-height:min(70vh,calc(100dvh - 120px));overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:14px;z-index:10}
.panel h3{font-size:16px;margin-bottom:8px}
.note{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.note.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.note:not(.unread){padding-left:18px}
.note time{display:block;color:var(--muted);font-size:12px}

/* buttons, pills, forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.bad{color:var(--d-fg)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:12px 24px;font-size:16px}
.btn.full{width:100%;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-pending{background:var(--pe-bg);color:var(--pe-fg)}
.s-queued{background:var(--q-bg);color:var(--q-fg)}
.s-printing{background:var(--p-bg);color:var(--p-fg)}
.s-completed{background:var(--c-bg);color:var(--c-fg)}
.s-declined{background:var(--d-bg);color:var(--d-fg)}
.tag{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:600;display:inline-block}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,.field textarea,.toolbar input,.toolbar select,.job select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;color:var(--ink);width:100%;min-width:0}
.err{margin:0;color:var(--d-fg);background:var(--d-bg);border-radius:8px;padding:8px 12px;font-size:13.5px}
.pw{position:relative}
.pw input{padding-right:62px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;padding:6px}

/* layout blocks */
.head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.head h2{font-size:30px}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;gap:12px;align-items:center}
.stat b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat .ic{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card>h3{font-size:18px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.card>.sub{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack>*+*{margin-top:18px}
.narrow{max-width:520px;margin-inline:auto}
.back{display:inline-flex;margin-bottom:14px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px}
.toolbar input{flex:1 1 220px;width:auto}
.toolbar select{width:auto}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:14px}
.empty .ic{margin-bottom:8px}
.footnote{margin-top:28px;font-size:12.5px;color:var(--muted)}

/* landing */
.hero{text-align:center;padding:44px 0 36px}
.hero h2{font-size:clamp(32px,5.5vw,52px);margin-bottom:14px}
.hero p{max-width:56ch;margin:0 auto 24px;font-size:18px;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.feat h3{font-size:19px}
.feat ul{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.feat ul li::before{content:"•";margin-right:8px;color:var(--accent)}
.section-h{text-align:center;font-size:28px;margin:30px 0 20px}

/* auth */
.authwrap{min-height:calc(100vh - 230px);display:flex;align-items:center;justify-content:center;padding:12px 0 36px}
.authwrap .authbox{width:100%}
.authbox{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:520px;margin-inline:auto}
.authbox.two{max-width:920px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media(max-width:800px){.authbox.two{grid-template-columns:minmax(0,1fr)}}
.auth-card h2{font-size:26px;margin:4px 0 6px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.acct{display:flex;gap:12px;justify-content:space-between;align-items:center}

/* upload + jobs */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-family:var(--font-display);font-size:17px}
.drop span{font-size:13px;color:var(--muted)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.draft{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--surface-2)}
.draft-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.fname{font-weight:600;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opts .wide{grid-column:1/-1}
.draft-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.price{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0}
.job+.job{margin-top:10px}
.job-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.job .meta{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.job .note-l{font-size:12.5px;margin-top:6px;font-weight:600}
.n-print{color:var(--p-fg)}.n-done{color:var(--c-fg)}.n-bad{color:var(--d-fg)}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.colhead h3{font-size:16px}
.count{background:var(--accent-soft);color:var(--accent);border-radius:999px;font-weight:700;font-size:12.5px;padding:2px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;background:var(--surface-2);border-radius:10px;min-width:0}
.row+.row{margin-top:8px}
.row>span{min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.log li{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:0}
.log time{display:block;color:var(--muted);font-size:12px}

/* profiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pcard h3{font-size:17px}
.pcard .muted{font-size:13px;overflow-wrap:anywhere}
.quote{padding:12px 14px;background:var(--surface-2);border-radius:10px;font-style:italic;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.hcenter{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.camlabel{position:relative;display:inline-block}
.camlabel .camb{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.camlabel input{position:absolute;opacity:0;width:1px;height:1px}
.camlabel:focus-within .camb{outline:2px solid var(--accent);outline-offset:2px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{font-size:20px;margin-bottom:12px;overflow-wrap:anywhere}
.prev{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px;max-height:240px;overflow:auto;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
.prev img{max-width:100%;display:block;margin:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:40;max-width:calc(100vw - 32px);text-align:center}
/* colour layer: print-process cyan, magenta and yellow around the indigo accent */
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 0% -8%,color-mix(in srgb,var(--cy-soft) 75%,transparent),transparent 62%),radial-gradient(820px 400px at 100% -8%,color-mix(in srgb,var(--mg-soft) 75%,transparent),transparent 62%);background-repeat:no-repeat}
.bar{border-bottom:0}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cy) 0 33.3%,var(--mg) 33.3% 66.6%,var(--yl) 66.6%)}
.logo{background:linear-gradient(135deg,var(--cy) 0%,var(--accent) 58%,var(--mg) 135%);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.pri{box-shadow:0 2px 0 rgba(0,0,0,.16),0 8px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.card>h3 .ic,.colhead h3 .ic{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.steps i.on{background:linear-gradient(90deg,var(--cy),var(--accent))}
.count{background:var(--yl-soft);color:var(--yl-ink)}
.tag{background:var(--cy-soft);color:var(--cy-ink)}
.drop{border-color:color-mix(in srgb,var(--cy) 65%,transparent);background:linear-gradient(135deg,var(--cy-soft),var(--surface-2) 62%)}
.drop:hover,.drop.over{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--cy-soft))}
.price{color:var(--accent)}

/* dashboard banners, tinted by role: client cyan, shop yellow, admin magenta */
.head{--role:var(--accent);--role-soft:var(--accent-soft);position:relative;overflow:hidden;background:linear-gradient(100deg,var(--surface) 38%,var(--role-soft));border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.head>*{position:relative;z-index:1}
.head::after{content:"";position:absolute;right:0;top:0;bottom:0;width:48%;background-image:radial-gradient(var(--role) 1.5px,transparent 2px);background-size:12px 12px;opacity:.3;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}
.h-cy{--role:var(--cy);--role-soft:var(--cy-soft)}
.h-yl{--role:var(--yl);--role-soft:var(--yl-soft)}
.h-mg{--role:var(--mg);--role-soft:var(--mg-soft)}
.rc-cy,.rc-yl,.rc-mg{display:inline-block;border-radius:999px;padding:3px 11px;margin-bottom:8px}
.rc-cy{background:var(--cy-soft);color:var(--cy-ink)}
.rc-yl{background:var(--yl-soft);color:var(--yl-ink)}
.rc-mg{background:var(--mg-soft);color:var(--mg-ink)}

/* stat tiles: icon bubbles cycle through the four colours */
.stat>.ic{box-sizing:content-box;width:22px;height:22px;padding:10px;border-radius:12px}
.stats .stat:nth-child(4n+1)>.ic{background:var(--cy-soft);color:var(--cy-ink)}
.stats .stat:nth-child(4n+2)>.ic{background:var(--mg-soft);color:var(--mg-ink)}
.stats .stat:nth-child(4n+3)>.ic{background:var(--yl-soft);color:var(--yl-ink)}
.stats .stat:nth-child(4n+4)>.ic{background:var(--accent-soft);color:var(--accent)}

/* landing */
.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface),var(--surface-2));padding:64px 20px 56px;margin-bottom:8px}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--mg) 1.4px,transparent 1.9px);background-size:14px 14px;opacity:.2;-webkit-mask-image:linear-gradient(115deg,#000,transparent 50%);mask-image:linear-gradient(115deg,#000,transparent 50%)}
.hero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-70px;top:-90px;background:var(--cy-soft);box-shadow:-150px 170px 0 -50px var(--yl-soft),-250px 30px 0 -105px var(--mg-soft)}

(function(){

  var BASE_RATE=5;
  var IC={
    printer:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
    file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',

    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    logout:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="m16 8 4 4-4 4"/><path d="M20 12H9"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
    eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m6 7 1 13h10l1-13"/>',
    bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    back:'<path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
    trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    chart:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M3 20h18"/>',
    save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/>'
  };
  function ic(n,c){return '<svg class="ic '+(c||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}

  /* ---------- data ---------- */
  function ago(m){return Date.now()-m*60000}
  function seed(){
    var accounts=[
      {id:'c1',name:'Maria Santos',email:'maria.santos@example.com',pw:'customer123',type:'client',quote:'',img:'',sample:true},
      {id:'s1',name:'CHaSS Building Print Shop',email:'library.shop@example.com',pw:'shop1234',type:'shop',quote:'Fast, clean prints for every student.',img:'',sample:true},
      {id:'s2',name:'NSB Building Print Shop',email:'engg.shop@example.com',pw:'shop5678',type:'shop',quote:'',img:'',sample:true},
      {id:'a1',name:'PrintEase Admin',email:'admin@example.com',pw:'admin1234',type:'admin',quote:'',img:'',sample:true},
      {id:'c2',name:'Jerome Dela Cruz',email:'jerome.dc@example.com',pw:'sample1234',type:'client',quote:'Print first, panic later.',img:''},
      {id:'c3',name:'Angelica Rosal',email:'angelica.r@example.com',pw:'sample1234',type:'client',quote:'',img:''},
      {id:'c4',name:'Kristine Lim',email:'kristine.l@example.com',pw:'sample1234',type:'client',quote:'',img:''},
      {id:'c5',name:'Prof. R. Gonzales',email:'r.gonzales@example.com',pw:'sample1234',type:'client',quote:'',img:''}
    ];
    function j(id,name,owner,pages,copies,color,paper,shop,status,min,sides,done){
      return {id:id,name:name,ownerId:owner,size:pages*60000,type:'application/pdf',pages:pages,copies:copies,paper:paper,color:color,sides:sides||'single',orient:'portrait',notes:'',shop:shop,skip:[],status:status,t:ago(min),doneAt:done?ago(done):0};
    }
    var jobs=[
      j('PE-0001','Lab_Report_Physics2.pdf','c2',12,2,'bw','A4','s1','pending',14),
      j('PE-0002','OJT_Certificate_Scan.pdf','c3',2,5,'color','Letter','s2','pending',22),
      j('PE-0003','Poster_Nutrition_Month.pdf','c4',1,3,'color','A3','s1','printing',41),
      j('PE-0004','Syllabus_ITEC105.docx','c5',6,40,'bw','A4','s2','queued',55,'double'),
      j('PE-0005','Enrollment_Form.pdf','c1',3,1,'bw','Letter','s1','completed',90,'single',30),
      j('PE-0006','Capstone_Proposal_v2.pdf','c1',30,2,'bw','A4','any','pending',9,'double')
    ];
    var notes=[{id:1,to:'c1',job:'PE-0005',text:'Enrollment_Form.pdf is complete and ready for pickup at CHaSS Building Print Shop. Show ticket PE-0005.',t:ago(30),read:false,email:'maria.santos@example.com'}];
    accounts.forEach(function(a){if(a.sample)a.pw0=a.pw});
    return {v:3,accounts:accounts,jobs:jobs,notes:notes,seq:6,nseq:2,userId:null};
  }
  var D;
  function load(){
    try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===3&&o.accounts&&o.jobs)return o}}catch(e){}
    return seed();
  }
  function persist(){
    try{
      var o={v:3,accounts:D.accounts,jobs:D.jobs.map(function(x){var c={};for(var k in x)if(k!=='preview')c[k]=x[k];return c}),notes:D.notes,seq:D.seq,nseq:D.nseq,userId:D.userId};
      localStorage.setItem(KEY,JSON.stringify(o));
    }catch(e){}
  }
  D=load();
  var S={page:D.userId?'dashboard':'home',tab:{client:'upload',shop:'queue',admin:'all'},drafts:[],bell:false,modal:null,err:'',vals:{name:'',email:'',type:'client'},
    shopQ:'',shopF:'all',adminQ:'',adminF:'all',profQ:'',profTab:'clients',viewId:null,editing:false,pf:null,paying:false,pwMsg:null};
  S.drafts=[{id:'d1',ownerId:'c1',name:'Thesis_Chapter3_Draft.pdf',size:2480000,type:'application/pdf',pages:48,copies:1,paper:'A4',color:'bw',sides:'double',orient:'portrait',shop:'s1',notes:'Staple top-left.',sample:true,preview:null}];

  /* ---------- helpers ---------- */
  function $(s,r){return (r||document).querySelector(s)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function tz(o){o.timeZone='Asia/Manila';return o}
  function fmtT(t){try{return new Date(t).toLocaleString('en-PH',tz({month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}catch(e){return ''}}
  function fmtD(t){try{return new Date(t).toLocaleDateString('en-PH',tz({month:'short',day:'numeric',year:'numeric'}))}catch(e){return ''}}
  function fmtSize(b){return b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB'}
  function peso(n){return '₱'+n.toLocaleString('en-PH')}
  function rateOf(shopId){var a=shopId&&shopId!=='any'?acct(shopId):null;var r=a&&a.type==='shop'?Number(a.rate):NaN;return r>0?r:BASE_RATE}
  function cost(o){var r=o.rate>0?o.rate:rateOf(o.shop);return o.pages*o.copies*r*(o.paper==='A3'?2:1)}
  function priceNote(d){var r=rateOf(d.shop);return d.shop==='any'?'Base rate ₱'+BASE_RATE+' per page. The shop that accepts your file sets the final rate.':'₱'+r+' per page'}
  function acct(id){return D.accounts.filter(function(a){return a.id===id})[0]}
  function me(){return D.userId?acct(D.userId):null}
  function shops(){return D.accounts.filter(function(a){return a.type==='shop'})}
  function shopName(id){if(id==='any')return 'Any available shop';var a=acct(id);return a?a.name:'Unknown shop'}
  function ownerName(j){var a=acct(j.ownerId);return a?a.name:'Unknown'}
  function pill(s){return '<span class="pill s-'+s+'">'+ST[s]+'</span>'}
  function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(l)+'</option>'}
  function pad(n){return ('0000'+n).slice(-4)}
  function initial(a){return esc((a.name||'?').charAt(0).toUpperCase())}
  function avatar(a,size){return '<span class="avatar '+size+' av'+((a.name||'?').charCodeAt(0)%4)+'">'+(a.img?'<img src="'+esc(a.img)+'" alt="">':initial(a))+'</span>'}
  var TYPE_L={client:'Client',shop:'Print shop',admin:'Admin'};
  function jobsFor(f){return D.jobs.filter(f).sort(function(a,b){return b.t-a.t})}
  var toastT;
  function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3400)}

  /* ---------- notifications and status flow ---------- */
  function notify(j,text,email){D.notes.unshift({id:D.nseq++,to:j.ownerId,job:j.id,text:text,t:Date.now(),read:false,email:email||''})}
  function setStatus(j,s){
    var sh=me(),shn=sh?sh.name:shopName(j.shop),o=acct(j.ownerId),first=o?o.name.split(' ')[0]:'Owner';
    if(s==='queued'){if(j.shop==='any')j.shop=sh.id;j.rate=rateOf(j.shop);notify(j,j.name+' was accepted by '+shn+' and is queued. Payment first is required. Check the shop\'s profile.')}
    if(s==='printing')notify(j,j.name+' is now printing at '+shn+'.');
    if(s==='completed'){j.doneAt=Date.now();notify(j,j.name+' is complete and ready for pickup at '+shn+'. Show ticket '+j.id+'.',o?o.email:'')}
    if(s==='declined')notify(j,j.name+' was declined by '+shn+'. Check the file and send it again.');
    j.status=s;
    toast(s==='completed'?first+' notified in the app and by email':first+' notified: '+ST[s].toLowerCase());
  }

  /* ---------- top bar ---------- */

      if(u.type!=='admin')h+='<button class="btn ghost sm" data-act="go" data-p="profiles">'+ic('users','sm')+'View Profiles</button>';

  function pgAuth(up){
    var v=S.vals;
    var form='<section class="card auth-card"><div class="eyebrow">Printing System</div><h2>'+(up?'Create Account':'Welcome Back')+'</h2><p class="sub">'+(up?'Join PrintEase and start managing your printing needs.':'Sign in to your PrintEase account.')+'</p><form id="authForm" novalidate>';
    if(up)form+='<label class="field">Full name or shop name<input id="au-name" autocomplete="name" placeholder="Enter your name" value="'+esc(v.name)+'"></label>';
    form+='<label class="field">Email<input id="au-email" type="email" autocomplete="username" placeholder="Enter your email" value="'+esc(v.email)+'"></label>';

  function modalHtml(){

    var o=acct(j.ownerId),pv='',fc=(S.fc||{})[j.id];
    var sheet=function(note){
      var lines='',k;for(k=0;k<14;k++)lines+='<i class="'+(k%5===4?'s':k%3===2?'m':'')+'"></i>';
      return '<div class="sheet"><div class="paper'+(j.orient==='landscape'?' land':'')+(j.color==='color'?' col':'')+'"><b>'+esc(j.name)+'</b><small>'+j.pages+' page'+(j.pages>1?'s':'')+' · '+j.paper+' · '+(j.color==='bw'?'B&amp;W':'Colour')+'</small>'+lines+'</div></div><p class="fnote">'+note+'</p>';
    };
    var dl=fc&&fc.u?' <a href="'+esc(fc.u)+'" download="'+esc(j.name)+'">Download the original file</a>':'';
    if(j.hasFile&&(!fc||fc.k==='load'))pv='<div class="sheet"><span class="muted">Loading the file…</span></div>';
    else if(fc&&fc.k==='img')pv='<div class="prev"><img src="'+esc(fc.u)+'" alt="Preview of '+esc(j.name)+'"></div><p class="fnote">'+dl+'</p>';
    else if(fc&&fc.k==='txt')pv='<div class="prev">'+esc(fc.v)+'</div><p class="fnote">'+dl+'</p>';
    else if(fc&&fc.k==='docx')pv='<div class="prev doc"><div class="docx">'+fc.v+'</div></div><p class="fnote">Shown as a reading view. Fonts and page layout can differ from Word.'+dl+'</p>';
    else if(fc&&fc.k==='pdf')pv='<div class="prev"><iframe src="'+esc(fc.u)+'" title="Preview of '+esc(j.name)+'"></iframe></div><p class="fnote"><a href="'+esc(fc.u)+'" target="_blank" rel="noopener">Open in a new tab</a> ·'+dl+'</p>';
    else if(fc&&fc.k==='other')pv=sheet('This file type cannot be shown in the browser, so the sheet shows the print settings.'+dl);
    else if(fc&&fc.k==='none')pv=sheet('The original file was not found in this browser, so the sheet shows the print settings.');
    else pv=sheet('No original file is stored for this job, so the sheet shows the print settings.');
    return '<div class="overlay" id="ovl"><div class="modal" role="dialog" aria-modal="true" aria-label="File details"><div class="mhead"><span class="logo" aria-hidden="true">'+ic('printer','lg')+'</span><span><b>PrintEase</b><small>'+esc(shopName(j.shop))+'</small></span></div><h3>'+esc(j.name)+'</h3><dl class="kv"><dt>Ticket</dt><dd class="mono">'+j.id+'</dd><dt>Status</dt><dd>'+pill(j.status)+'</dd><dt>Client</dt><dd>'+esc(o?o.name:'Unknown')+(o?' · '+esc(o.email):'')+'</dd><dt>File type</dt><dd>'+esc(typeLabel(j))+' · '+fmtSize(j.size)+'</dd><dt>Copies</dt><dd>'+j.copies+'</dd><dt>Pages</dt><dd>'+j.pages+'</dd><dt>Paper size</dt><dd>'+j.paper+' · '+(j.orient==='landscape'?'Landscape':'Portrait')+'</dd><dt>Print</dt><dd>'+(j.color==='bw'?'Black & white':'Full colour')+' · '+(j.sides==='double'?'Two-sided':'One-sided')+'</dd><dt>Shop</dt><dd>'+esc(shopName(j.shop))+'</dd><dt>Uploaded</dt><dd>'+fmtT(j.t)+'</dd><dt>Notes</dt><dd>'+(j.notes?esc(j.notes):'None')+'</dd></dl>'+pv+printPanel(j)+'<div class="actions"><button class="btn pri" data-act="closemodal">Close</button></div></div></div>';
  }

  /* ---------- render ---------- */
  function render(){
    var p=S.page,u=me();
    if(['dashboard','profile','profiles','profile-detail','shop-view'].indexOf(p)>-1&&!u)p=S.page='login';
    renderNav();
    var h='';
    if(p==='home')h=pgHome();
    else if(p==='login')h=pgAuth(false);
    else if(p==='signup')h=pgAuth(true);
    else if(p==='dashboard')h=u.type==='client'?pgClient():u.type==='shop'?pgShop():pgAdmin();
    else if(p==='profile')h=pgProfile();
    else if(p==='profiles')h=pgProfiles();
    else if(p==='profile-detail')h=pgDetail();
    else if(p==='shop-view')h=pgShopView();
    $('#view').innerHTML=h;
    $('#modal').innerHTML=modalHtml();
    bind();persist();
  }
  function go(p){S.page=p;S.err='';S.bell=false;S.modal=null;S.editing=false;S.pf=null;S.paying=false;S.pwMsg=null;S.rateMsg=null;if(p==='login'||p==='signup'){S.vals={name:'',email:'',type:'client'}}window.scrollTo(0,0);render()}
  function login(a){D.userId=a.id;S.err='';S.vals={name:'',email:'',type:'client'};S.tab={client:'upload',shop:'queue',admin:'all'};go('dashboard');toast('Signed in as '+a.name)}
  function fail(m,v){S.err=m;S.vals=v||S.vals;render()}

  /* ---------- events ---------- */
  function refocus(id,pos){var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  function addFiles(list){
    Array.prototype.forEach.call(list,function(f){
      var d={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ownerId:D.userId,name:f.name,size:f.size,type:f.type||'application/octet-stream',pages:Math.min(300,Math.max(1,Math.round(f.size/90000))),copies:1,paper:'A4',color:'bw',sides:'single',orient:'portrait',shop:'any',notes:'',preview:null};
      S.drafts.push(d);
      d.file=f;
    });
    render();toast(list.length+' file'+(list.length>1?'s':'')+' ready to customize');
  }
  function bind(){
    var fi=$('#fileIn');if(fi)fi.addEventListener('change',function(){if(fi.files.length)addFiles(fi.files)});
    var dz=$('#drop');
    if(dz){
      ['dragenter','dragover'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.add('over')})});
      ['dragleave','drop'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.remove('over')})});
      dz.addEventListener('drop',function(ev){if(ev.dataTransfer&&ev.dataTransfer.files.length)addFiles(ev.dataTransfer.files)});
    }
    var py=$('#payImg');
    if(py)py.addEventListener('change',function(){
      var f=py.files[0],u=me();if(!f||!u)return;
      if(!/^image\//.test(f.type)){toast('Choose an image file');return}
      if(f.size>1500000){toast('Choose an image under 1.5 MB');return}
      var r=new FileReader();r.onload=function(){u.pay=r.result;render();toast('Payment image saved')};r.readAsDataURL(f);
    });
    var pi=$('#pfImg');
    if(pi)pi.addEventListener('change',function(){
      var f=pi.files[0];if(!f)return;
      if(f.size>1500000){toast('Choose a photo under 1.5 MB');return}
      var r=new FileReader();r.onload=function(){S.pf.img=r.result;render()};r.readAsDataURL(f);
    });
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='ovl'){S.modal=null;render();return}
    var b=e.target.closest('[data-act]');
    if(!b){if(S.bell&&!e.target.closest('.panel')){S.bell=false;renderNav()}return}
    var act=b.dataset.act,id=b.dataset.id,u=me();
    if(act==='go'){go(b.dataset.p);return}
    if(act==='logout'){D.userId=null;S.bell=false;S.drafts.forEach(function(){});go('home');toast('Signed out');return}
    if(act==='ratebase'){var rb=me();if(rb&&rb.type==='shop'){rb.rate=BASE_RATE;S.rateMsg={ok:true,t:'Price reset to ₱'+BASE_RATE+' per page.'};render();toast('Price reset')}return}
    if(act==='quick'){var qa=acct(id);if(qa)login(qa);return}
    if(act==='togglepw'){var inp=document.getElementById(b.dataset.t);if(inp){var show=inp.type==='password';inp.type=show?'text':'password';b.textContent=show?'Hide':'Show'}return}
    if(act==='bell'){S.bell=!S.bell;if(!S.bell)D.notes.forEach(function(n){if(u&&n.to===u.id)n.read=true});render();return}
    if(act==='tab'){S.tab[b.dataset.r]=b.dataset.t;render();return}
    if(act==='proftab'){S.profTab=b.dataset.t;render();return}
    if(act==='rmdraft'){S.drafts=S.drafts.filter(function(d){return d.id!==id});render();return}
    if(act==='queue'){
      var d=S.drafts.filter(function(x){return x.id===id})[0];if(!d)return;
      var tk='PE-'+pad(++D.seq);
      D.jobs.push({id:tk,name:d.name,ownerId:D.userId,size:d.size,type:d.type,pages:d.pages,copies:d.copies,paper:d.paper,color:d.color,sides:d.sides,orient:d.orient,notes:d.notes,shop:d.shop,skip:[],status:'pending',t:Date.now(),doneAt:0,hasFile:!!d.file});
      if(d.file)FILES.put(tk,d.file);
      S.drafts=S.drafts.filter(function(x){return x.id!==id});
      S.tab.client='jobs';render();toast('Submitted as '+tk+'. Waiting for a shop to accept it.');return;
    }
    if(act==='deljob'){D.jobs=D.jobs.filter(function(j){return j.id!==id});FILES.del(id);if(S.fc&&S.fc[id]){try{URL.revokeObjectURL(S.fc[id].u)}catch(er){}delete S.fc[id]}render();toast('Print job deleted');return}
    if(act==='st'){var j=D.jobs.filter(function(x){return x.id===id})[0];if(j){setStatus(j,b.dataset.s);render()}return}
    if(act==='decline'){
      var dj=D.jobs.filter(function(x){return x.id===id})[0];if(!dj)return;
      if(dj.shop==='any'){dj.skip=(dj.skip||[]).concat([u.id]);render();toast('Hidden from your queue. Other shops can still accept it.')}
      else{setStatus(dj,'declined');render()}
      return;
    }
    if(act==='view'){S.modal=id;render();loadPreview(D.jobs.filter(function(x){return x.id===id})[0]);return}
    if(act==='printjob'){var pj=D.jobs.filter(function(x){return x.id===id})[0];printJob(pj);return}
    if(act==='closemodal'){S.modal=null;render();return}
    if(act==='editprofile'){S.editing=true;S.err='';S.pf={name:u.name,email:u.email,quote:u.quote||'',img:u.img||''};render();return}
    if(act==='cancelprofile'){S.editing=false;S.pf=null;S.err='';render();return}
    if(act==='saveprofile'){
      var p=S.pf,nm=p.name.trim(),em=p.email.trim().toLowerCase();
      if(!nm||!em){S.err='Name and email are required.';render();return}
      if(!/^\S+@\S+\.\S+$/.test(em)){S.err='Enter a valid email address.';render();return}
      if(D.accounts.some(function(a){return a.id!==u.id&&a.email===em})){S.err='Another account already uses this email.';render();return}
      u.name=nm;u.email=em;u.quote=p.quote.trim();u.img=p.img;S.editing=false;S.pf=null;S.err='';render();toast('Profile saved');return;
    }
    if(act==='shopview'){S.page='shop-view';window.scrollTo(0,0);render();return}
    if(act==='viewprofile'){S.viewId=id;S.page='profile-detail';S.paying=false;window.scrollTo(0,0);render();return}
    if(act==='copy'){
      var v=b.dataset.v;
      try{navigator.clipboard.writeText(v).then(function(){toast('Email copied')},function(){toast('Select the email and copy it')})}catch(er){toast('Select the email and copy it')}
      return;
    }
    if(act==='removepay'){if(u){u.pay='';render();toast('Payment image removed')}return}
    if(act==='pay'){S.paying=true;render();return}
    if(act==='paycancel'){S.paying=false;render();return}
    if(act==='reset'){try{localStorage.removeItem(KEY)}catch(er){}FILES.clear();S.fc={};D=seed();S.drafts=[{id:'d1',ownerId:'c1',name:'Thesis_Chapter3_Draft.pdf',size:2480000,type:'application/pdf',pages:48,copies:1,paper:'A4',color:'bw',sides:'double',orient:'portrait',shop:'s1',notes:'Staple top-left.',sample:true,preview:null}];go('home');toast('Sample data restored');return}
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='shopQ'||t.id==='adminQ'||t.id==='profQ'){
      var pos=t.selectionStart,id=t.id;
      if(id==='shopQ')S.shopQ=t.value;else if(id==='adminQ')S.adminQ=t.value;else S.profQ=t.value;
      render();refocus(id,pos);return;
    }
    if(t.dataset&&t.dataset.pf){S.pf[t.dataset.pf]=t.value;return}
    draftEdit(t);
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='shopF'){S.shopF=t.value;render();return}
    if(t.id==='adminF'){S.adminF=t.value;render();return}
    if(t.dataset&&t.dataset.move){
      var j=D.jobs.filter(function(x){return x.id===t.dataset.move})[0];
      if(j){j.shop=t.value;j.skip=[];render();toast(j.id+' sent to '+shopName(j.shop))}
      return;
    }
    draftEdit(t);
  });
  function draftEdit(el){
    if(!el.dataset||!el.dataset.f)return;
    var card=el.closest('[data-draft]');if(!card)return;
    var d=S.drafts.filter(function(x){return x.id===card.dataset.draft})[0];if(!d)return;
    var k=el.dataset.f,v=el.value;
    if(k==='pages')v=Math.max(1,Math.min(999,parseInt(v,10)||1));
    if(k==='copies')v=Math.max(1,Math.min(100,parseInt(v,10)||1));
    d[k]=v;
    var p=$('[data-price]',card);
    if(p)p.innerHTML=peso(cost(d))+'<small>'+priceNote(d)+'</small>';
  }
  document.addEventListener('submit',function(e){
    var f=e.target;
    if(f.id==='rateForm'){
      e.preventDefault();
      var ru=me(),rv=Math.round(Number($('#rate-v').value));
      if(!ru||ru.type!=='shop')return;
      if(!(rv>=1&&rv<=999)){S.rateMsg={ok:false,t:'Enter a price from ₱1 to ₱999 per page.'};render();return}
      ru.rate=rv;S.rateMsg={ok:true,t:'Saved. New jobs at your shop are priced at ₱'+rv+' per page.'};render();toast('Price per page saved');return;
    }
    if(f.id==='pwForm'){
      e.preventDefault();
      var pu=me(),cur=$('#pw-cur').value,nw=$('#pw-new').value,nw2=$('#pw-new2').value,pm='';
      if(!cur||!nw||!nw2)pm='Fill in all three fields.';
      else if(cur!==pu.pw)pm='Your current password is incorrect.';
      else if(nw.length<8)pm='Use a password with at least 8 characters.';
      else if(nw===cur)pm='Choose a password different from your current one.';
      else if(nw!==nw2)pm='The new passwords do not match.';
      if(pm){S.pwMsg={ok:false,t:pm};render();return}
      pu.pw=nw;S.pwMsg={ok:true,t:'Password updated. Use it the next time you sign in.'};render();toast('Password updated');return;
    }
    if(f.id!=='authForm')return;
    e.preventDefault();
    var up=S.page==='signup',em=$('#au-email').value.trim().toLowerCase(),pw=$('#au-pw').value,a;
    if(up){
      var nm=$('#au-name').value.trim().replace(/\s+/g,' '),ty=$('#au-type').value,pw2=$('#au-pw2').value,v={name:nm,email:em,type:ty};
      if(!nm||!em||!pw)return fail('Enter your name, email and a password.',v);
      if(!/^\S+@\S+\.\S+$/.test(em))return fail('Enter a valid email address.',v);
      if(pw.length<8)return fail('Use a password with at least 8 characters.',v);
      if(pw!==pw2)return fail('The two passwords do not match.',v);
      if(D.accounts.some(function(x){return x.email===em}))return fail('An account with this email already exists. Sign in instead.',v);
      a={id:'u'+Date.now().toString(36),name:nm,email:em,pw:pw,type:ty,quote:'',img:''};
      D.accounts.push(a);login(a);
    }else{
      a=D.accounts.filter(function(x){return x.email===em&&x.pw===pw})[0];
      if(!a)return fail('Email or password is incorrect.',{name:'',email:em,type:'client'});
      login(a);
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(S.modal){S.modal=null;render()}
    else if(S.bell){S.bell=false;renderNav()}
  });

  render();
})();
</script>
</body>
</html
